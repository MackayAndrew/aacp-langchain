[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aacp-langchain"
version = "0.1.0"
description = "AACP coordination layer for LangChain multi-agent workflows"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Andrew Mackay", email = "mackayandrewr@gmail.com" }
]
keywords = [
    "aacp", "langchain", "agents", "multi-agent",
    "coordination", "llm", "protocol"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "aacp>=1.3.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.1.0"]
all = ["langchain-anthropic>=0.1.0"]

[project.urls]
Homepage   = "https://aacp.dev"
Repository = "https://github.com/MackayAndrew/aacp-langchain"
"AACP SDK" = "https://github.com/MackayAndrew/aacp"

[tool.setuptools.packages.find]
where   = ["."]
include = ["aacp_langchain*"]
